name: Build Windows Portable

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build from'
        required: true
        default: 'main'
  push:
    branches:
      - fork/portable-build

permissions:
  contents: write

concurrency:
  group: build-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Disable updater artifact signing requirement, but preserve plugins.updater config so app initialization doesn't panic
      - name: Disable updater signing requirement for build
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            if (p.bundle) p.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(p, null, 2));
          "

      - name: Build Tauri app
        shell: bash
        run: |
          npm run build
          npx tauri build

      - name: Package Windows portable zip
        shell: bash
        run: |
          node <<'SCRIPT'
          const fs = require('fs')
          const path = require('path')
          const { execSync } = require('child_process')

          const pkg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'))
          const version = pkg.version
          const targetDir = path.resolve('src-tauri/target/release')
          const bundleDir = path.resolve('src-tauri/target/release/bundle')
          fs.mkdirSync(bundleDir, { recursive: true })

          // Export version for GitHub Release step
          if (process.env.GITHUB_ENV) {
            fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${version}\n`)
          }

          const candidates = ['Sessions Viewer.exe', 'cc-sessions-viewer.exe']
          let exePath = null
          for (const name of candidates) {
            const p = path.join(targetDir, name)
            if (fs.existsSync(p)) {
              exePath = p
              break
            }
          }

          if (!exePath) {
            for (const f of fs.readdirSync(targetDir)) {
              if (f.endsWith('.exe') && !f.includes('build') && !f.includes('setup')) {
                exePath = path.join(targetDir, f)
                break
              }
            }
          }

          if (!exePath) {
            throw new Error(`Could not find compiled binary in ${targetDir}`)
          }

          const tempDir = fs.mkdtempSync(path.join(bundleDir, 'portable-'))
          const destExe = path.join(tempDir, 'Sessions Viewer.exe')
          fs.copyFileSync(exePath, destExe)

          const zipName = `Sessions.Viewer_${version}_x64_portable.zip`
          const zipPath = path.join(bundleDir, zipName)

          try {
            execSync(`7z a -tzip "${zipPath}" "Sessions Viewer.exe"`, { cwd: tempDir, stdio: 'inherit' })
          } catch {
            execSync(`powershell -Command "Compress-Archive -Path 'Sessions Viewer.exe' -DestinationPath '${zipPath}' -Force"`, { cwd: tempDir, stdio: 'inherit' })
          }

          fs.rmSync(tempDir, { recursive: true, force: true })
          console.log(`Created portable zip: ${zipPath}`)
          SCRIPT

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sessions.Viewer_portable_windows
          path: src-tauri/target/release/bundle/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-portable
          name: v${{ env.APP_VERSION }} (Windows Portable)
          body: |
            Standalone Windows portable release for `cc-sessions-viewer` v${{ env.APP_VERSION }}.
            
            - Built directly from branch/ref: `${{ github.event.inputs.ref || 'main' }}`
            - Zero installation required. Simply extract the zip and double-click `Sessions Viewer.exe` to run.
          files: src-tauri/target/release/bundle/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
